name: Build Calcy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix flaky apt mirror
        run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Install Buildozer
        run: pip install --upgrade buildozer

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('calcy_android_ready_v22/buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer app build directory
        uses: actions/cache@v4
        with:
          path: calcy_android_ready_v22/.buildozer
          key: buildozer-app-${{ hashFiles('calcy_android_ready_v22/buildozer.spec') }}
          restore-keys: |
            buildozer-app-

      - name: Build APK
        working-directory: calcy_android_ready_v22
        run: yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcy-debug-apk
          path: calcy_android_ready_v22/bin/*.apk
